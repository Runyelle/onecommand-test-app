# managed-by: onecommand
# Health-checks every Vercel deployment (previews and production) once it's ready.
# Generated by `npx onecommand init`. Re-run it to regenerate; manual edits are overwritten.

name: onecommand health

on:
  # Vercel's GitHub integration reports each deployment to GitHub as a
  # deployment status; this runs when one succeeds.
  deployment_status:

permissions:
  contents: read

jobs:
  health:
    # Add this name as a required Deployment Check in Vercel.
    name: onecommand-health
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check deployment health (GET only)
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          HEALTH_PATHS: '/api/health'
          EXPECT_STATUS: '200'
          EXPECT_TEXT: ''
          ATTEMPTS: '3'
          BACKOFF_MS: '5000'
          TIMEOUT_MS: '15000'
        run: |
          node <<'ONECOMMAND_EOF'
          const { appendFileSync } = require("node:fs");

          const target = (process.env.TARGET_URL || "").trim();
          const paths = (process.env.HEALTH_PATHS || "/").split(",").map((p) => p.trim()).filter(Boolean);
          const expectStatus = Number(process.env.EXPECT_STATUS || "200");
          const expectText = process.env.EXPECT_TEXT || "";
          const attempts = Math.max(1, Number(process.env.ATTEMPTS || "3"));
          const backoffMs = Math.max(0, Number(process.env.BACKOFF_MS || "5000"));
          const timeoutMs = Math.max(1000, Number(process.env.TIMEOUT_MS || "15000"));
          const bypass = process.env.BYPASS_SECRET || "";
          const allowHttp = process.env.ONECOMMAND_ALLOW_HTTP === "1";

          function fail(message) {
            console.log("::error title=onecommand health::" + message);
            process.exit(1);
          }

          if (!target) {
            fail("No deployment URL in the deployment_status event (environment_url was empty).");
          }

          let base;
          try {
            base = new URL(/^https?:\/\//i.test(target) ? target : "https://" + target);
          } catch {
            fail("Not a valid deployment URL: " + target);
          }
          if (base.protocol !== "https:" && !(allowHttp && base.protocol === "http:")) {
            fail("Refusing to health-check a non-HTTPS URL: " + base.origin);
          }

          const headers = { "user-agent": "onecommand-health" };
          const sendBypass = Boolean(bypass) && base.hostname.endsWith(".vercel.app");
          if (sendBypass) headers["x-vercel-protection-bypass"] = bypass;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function checkPath(rawPath) {
            const url = new URL(rawPath.startsWith("/") ? rawPath : "/" + rawPath, base);
            if (url.origin !== base.origin) {
              return { path: rawPath, ok: false, status: "-", ms: 0, attempt: 0, detail: "path must stay on the deployment's own host" };
            }
            let last;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const started = Date.now();
              try {
                const res = await fetch(url, {
                  method: "GET",
                  headers,
                  redirect: "manual",
                  signal: AbortSignal.timeout(timeoutMs),
                });
                const body = await res.text();
                const statusOk = res.status === expectStatus;
                const textOk = !expectText || body.includes(expectText);
                last = {
                  path: rawPath,
                  ok: statusOk && textOk,
                  status: res.status,
                  ms: Date.now() - started,
                  attempt,
                  detail: !statusOk
                    ? "expected " + expectStatus + ", got " + res.status
                    : !textOk
                      ? "response doesn't contain the expected text"
                      : "ok",
                };
              } catch (err) {
                const timedOut = err && (err.name === "TimeoutError" || err.name === "AbortError");
                last = {
                  path: rawPath,
                  ok: false,
                  status: "-",
                  ms: Date.now() - started,
                  attempt,
                  detail: timedOut ? "timed out after " + timeoutMs + "ms" : "request failed: " + (err && err.message),
                };
              }
              if (last.ok) return last;
              if (attempt < attempts) await sleep(backoffMs * attempt);
            }
            return last;
          }

          (async () => {
            console.log("Health-checking " + base.origin + (sendBypass ? " (with protection bypass)" : ""));
            const results = [];
            for (const p of paths) {
              const r = await checkPath(p);
              results.push(r);
              console.log((r.ok ? "PASS " : "FAIL ") + r.path + "  status=" + r.status + "  " + r.ms + "ms  attempt " + r.attempt + "/" + attempts + "  " + r.detail);
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              const esc = (s) => String(s).replace(/\|/g, "\\|");
              const rows = results.map((r) =>
                "| " + (r.ok ? "✅" : "❌") + " | " + esc(r.path) + " | " + r.status + " | " + r.ms + " ms | " + r.attempt + "/" + attempts + " | " + esc(r.detail) + " |"
              );
              appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                ["### onecommand health: " + base.origin, "", "| | Path | Status | Time | Attempt | Result |", "|---|---|---|---|---|---|", ...rows, ""].join("\n") + "\n"
              );
            }

            const failed = results.filter((r) => !r.ok);
            if (failed.length > 0) {
              fail(failed.length + " of " + results.length + " health check(s) failed on " + base.origin);
            }
            console.log("All health checks passed.");
          })();
          ONECOMMAND_EOF
