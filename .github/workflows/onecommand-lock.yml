# managed-by: onecommand
# Holds production releases after the demo-day lock time (set with `npx onecommand lock`).
# Generated by `npx onecommand init`. Re-run it to regenerate; manual edits are overwritten.

name: onecommand lock

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

jobs:
  lock:
    # Add this name as a required Deployment Check in Vercel.
    name: onecommand-lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check demo-day lock
        env:
          LOCK_AT: ${{ vars.ONECOMMAND_LOCK_AT }}
        run: |
          node <<'ONECOMMAND_EOF'
          const raw = (process.env.LOCK_AT || "").trim();
          if (!raw) {
            console.log("No demo-day lock is set. Production releases are allowed.");
            process.exit(0);
          }
          const at = Date.parse(raw);
          if (Number.isNaN(at)) {
            console.log("::error title=onecommand lock::The lock variable holds an invalid time (" + raw + "). Run 'npx onecommand unlock' or set a new lock.");
            process.exit(1);
          }
          const now = Date.now();
          if (now >= at) {
            console.log("::error title=onecommand lock::Production has been locked since " + new Date(at).toISOString() + ". This release is held. Run 'npx onecommand unlock' and re-run this check, or use Force Promote in Vercel.");
            process.exit(1);
          }
          const minutes = Math.round((at - now) / 60000);
          console.log("Demo-day lock is set for " + new Date(at).toISOString() + " (" + minutes + " min from now). This release is allowed.");
          ONECOMMAND_EOF
